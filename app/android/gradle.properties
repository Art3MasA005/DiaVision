org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The repository path contains spaces ("DiaVision"), and the Kotlin
# build-tools API cannot close its incremental caches under such a path on
# Windows — every assembleDebug fails with "Could not close incremental caches
# in ...\caches-jvm\jvm\kotlin". Turning incremental compilation off avoids
# those caches entirely. It costs a few seconds per build; the plugins here are
# small. Remove this if the project ever lives at a space-free path.
kotlin.incremental=false

# Low-memory machines: compile Kotlin inside the Gradle daemon instead of a
# second JVM that would reserve its own heap.
kotlin.compiler.execution.strategy=in-process
